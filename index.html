<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Glosario Omnicanal · Chedraui</title>
  <meta name="description" content="Glosario técnico de AppNativa / Chedraui Omnicanal: VTEX, BFF, Super Veloz, checkout y más." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f6f2;
      --ink: #141816;
      --muted: #5c675f;
      --line: #d9ddd8;
      --card: #ffffff;
      --ched: #c4a000;
      --ched-ink: #5c4a00;
      --ched-soft: #f5e7a0;
      --shadow: 0 1px 0 rgba(20, 24, 22, 0.04), 0 12px 32px rgba(20, 24, 22, 0.06);
      --font-display: "Fraunces", Georgia, serif;
      --font-body: "Manrope", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(900px 420px at 10% -10%, rgba(196, 160, 0, 0.18), transparent 60%),
        radial-gradient(700px 380px at 100% 0%, rgba(20, 24, 22, 0.06), transparent 55%),
        var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 20px 72px;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(2rem, 4.5vw, 2.75rem);
      letter-spacing: -0.03em;
      line-height: 1.05;
    }

    h1 span { color: var(--ched); }

    .meta {
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.45;
      max-width: 54ch;
    }

    .toolbar {
      display: grid;
      gap: 12px;
      margin-bottom: 18px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: var(--shadow);
    }

    .search {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font: 600 1rem var(--font-body);
      background: #fbfaf7;
      color: var(--ink);
      outline: none;
    }

    .search:focus {
      border-color: var(--ched);
      box-shadow: 0 0 0 3px rgba(196, 160, 0, 0.18);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 12px;
      font: 700 0.78rem var(--font-body);
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
    }

    .chip:hover { border-color: #cfc7a0; color: var(--ink); }

    .chip.active {
      background: var(--ched-soft);
      border-color: #e2cd6a;
      color: var(--ched-ink);
    }

    .stats {
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px 18px 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 150px;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 36px rgba(20, 24, 22, 0.1);
    }

    .badge {
      align-self: flex-start;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ched-ink);
      background: var(--ched-soft);
      border-radius: 999px;
      padding: 4px 9px;
    }

    .card h2 {
      margin: 0;
      font-size: 1.08rem;
      line-height: 1.25;
      letter-spacing: -0.01em;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
      flex: 1;
    }

    .empty {
      display: none;
      text-align: center;
      padding: 48px 16px;
      color: var(--muted);
      font-weight: 600;
    }

    .empty.show { display: block; }

    mark {
      background: var(--ched-soft);
      color: var(--ink);
      border-radius: 3px;
      padding: 0 2px;
    }

    footer {
      margin-top: 28px;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Glosario <span>Omnicanal</span></h1>
      <p class="meta">Términos del día a día en AppNativa Chedraui: VTEX, BFF, Super Veloz, checkout, cuenta y proceso.</p>
    </header>

    <div class="toolbar">
      <input class="search" id="q" type="search" placeholder="Buscar término, sigla o concepto…" autocomplete="off" />
      <div class="chips" id="chips"></div>
      <div class="stats" id="stats"></div>
    </div>

    <div class="grid" id="grid"></div>
    <div class="empty" id="empty">No hay términos con ese filtro.</div>
    <footer>Fuentes: onboarding omnicanal · quiz AppNativa · reglas BFF/VTEX documentadas</footer>
  </div>

  <script>
    const CATEGORY_ORDER = [
      "Arquitectura", "Negocio", "Catálogo", "Veloz", "Checkout",
      "Cuenta", "Logística", "Pagos", "Técnica", "Proceso",
      "Calidad", "Azure", "Móvil",
    ];

    let terms = [];
    let activeCat = "Todos";

    const grid = document.getElementById("grid");
    const chips = document.getElementById("chips");
    const stats = document.getElementById("stats");
    const empty = document.getElementById("empty");
    const q = document.getElementById("q");

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function highlight(text, query) {
      const safe = escapeHtml(text);
      if (!query) return safe;
      const re = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "ig");
      return safe.replace(re, "<mark>$1</mark>");
    }

    function categories() {
      const set = new Set(terms.map((t) => t.category).filter(Boolean));
      return ["Todos", ...CATEGORY_ORDER.filter((c) => set.has(c)), ...[...set].filter((c) => !CATEGORY_ORDER.includes(c)).sort()];
    }

    function renderChips() {
      chips.innerHTML = categories().map((c) =>
        `<button type="button" class="chip${c === activeCat ? " active" : ""}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`
      ).join("");
    }

    function filtered() {
      const query = q.value.trim().toLowerCase();
      return terms
        .filter((t) => activeCat === "Todos" || t.category === activeCat)
        .filter((t) => {
          if (!query) return true;
          return (
            t.title.toLowerCase().includes(query) ||
            t.description.toLowerCase().includes(query) ||
            (t.category || "").toLowerCase().includes(query)
          );
        })
        .sort((a, b) => a.title.localeCompare(b.title, "es"));
    }

    function render() {
      const list = filtered();
      const query = q.value.trim();
      stats.textContent = `${list.length} de ${terms.length} términos`;
      empty.classList.toggle("show", list.length === 0);
      grid.innerHTML = list.map((t) => `
        <article class="card">
          <div class="badge">${escapeHtml(t.category || "General")}</div>
          <h2>${highlight(t.title, query)}</h2>
          <p>${highlight(t.description, query)}</p>
        </article>
      `).join("");
    }

    chips.addEventListener("click", (e) => {
      const btn = e.target.closest(".chip");
      if (!btn) return;
      activeCat = btn.dataset.cat;
      renderChips();
      render();
    });

    q.addEventListener("input", render);

    fetch("./data.json")
      .then((r) => r.json())
      .then((data) => {
        terms = Array.isArray(data) ? data : [];
        renderChips();
        render();
      })
      .catch(() => {
        stats.textContent = "No se pudo cargar data.json";
      });
  </script>
</body>
</html>
